asyncapi: 3.0.0
info:
  title: ViaTrade Telegram notification stream
  version: 1.0.0
  description: >-
    Redis Stream entries use either the backend's six string fields or one message
    field containing a JSON notification envelope. The unversioned backend fields
    are interpreted as schema version 1.
servers:
  redis:
    host: localhost:6379
    protocol: redis
channels:
  telegramNotifications:
    address: telegram:notifications
    messages:
      notification:
        $ref: '#/components/messages/Notification'
operations:
  publishNotification:
    action: send
    channel:
      $ref: '#/channels/telegramNotifications'
components:
  messages:
    Notification:
      name: notification
      title: Telegram notification
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NotificationStreamEntry'
  schemas:
    NotificationStreamEntry:
      oneOf:
        - $ref: '#/components/schemas/BackendStreamEntry'
        - $ref: '#/components/schemas/EnvelopeStreamEntry'
    BackendStreamEntry:
      type: object
      additionalProperties: false
      required: [notification_id, type, user_id, chat_id, payload, created_at]
      properties:
        notification_id:
          type: string
          example: reminder:42
        type:
          type: string
          const: reminder
        user_id:
          type: string
          description: User identifier as a decimal int32 string.
          example: '42'
        chat_id:
          type: string
          example: '123456789'
        payload:
          type: string
          description: JSON-encoded ReminderNotificationPayload.
          example: '{"reminderId":42,"text":"Buy","remindAt":"2026-10-10T14:25:00Z","instrumentTicker":"AAPL","instrumentId":123}'
        created_at:
          type: string
          format: date-time
    EnvelopeStreamEntry:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: JSON-encoded NotificationMessage with schemaVersion 1.
    NotificationMessage:
      type: object
      required:
        - notificationId
        - userId
        - chatId
        - payload
        - createdAt
        - type
        - schemaVersion
      properties:
        notificationId:
          type: string
          example: reminder:42
        userId:
          type: integer
          format: int32
        chatId:
          type: string
          example: '123456789'
        payload:
          oneOf:
            - $ref: '#/components/schemas/ReminderNotificationPayload'
        createdAt:
          type: string
          format: date-time
        type:
          type: string
          const: reminder
        schemaVersion:
          type: integer
          const: 1
    ReminderNotificationPayload:
      type: object
      description: >-
        Additive schema version 1 payload. Missing or null instrumentId preserves
        delivery without an instrument link. A valid ID enables a clickable instrument ticker
        only when the bot has VIATRADE_WEB_BASE_URL configured. The backend sends
        the ID, never a public URL. Invalid IDs follow the invalid_payload DLQ policy.
        Reminders place heading, colon, and ticker on the first line. An italic scheduled
        date and time line follows, then body text without blank separators. Heading and
        ticker are bold. The date comes from remindAt and is displayed in Moscow time
        (UTC+3), labelled MSK; offset-less legacy values are interpreted as UTC.
        Body text whitespace and line breaks are preserved; ticker whitespace is collapsed
        to single spaces. Formatting uses Telegram entities without HTML parsing or inline buttons.
        If Telegram explicitly rejects the text-link URL, the bot retries the rejected
        chunk once without text_link, preserving text and bold formatting; successful
        delivery is confirmed normally.
      required:
        - reminderId
        - text
        - remindAt
      properties:
        reminderId:
          type: integer
          format: int32
        text:
          type: string
        remindAt:
          description: User-scheduled reminder instant, published in UTC by the backend.
          type: string
          format: date-time
        instrumentTicker:
          description: Instrument label published by the backend.
          type:
            - string
            - 'null'
        instrumentId:
          description: Stable instrument ID used for the website stocks/{id} route.
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          maximum: 2147483647
          example: 123
